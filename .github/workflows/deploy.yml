# Lints, tests and builds the site, then publishes it to GitHub Pages
# (resume.heiland.tv, set by public/CNAME) on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job can publish.
permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # dist/ has no dotfiles, which v4+ of this action leaves out.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
