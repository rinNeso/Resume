    <!-- GitHub Pages can't send headers, so the policy rides in a meta tag.
         Inline styles are Vuetify's runtime theme; rinneso.github.io is the
         live worlds-cal feed. JSON-LD is data, not script, so it's unaffected. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rinneso.github.io; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- scripts/route-pages.mjs rewrites the title, description, og:/twitter:
         text, og:url and canonical for each page, and the noscript block. -->
